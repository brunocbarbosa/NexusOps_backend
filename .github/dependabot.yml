# Automated dependency updates.
#
# Complements, and does not replace, the `audit` job in ci.yml: Dependabot opens
# a PR but fails no build, and `npm audit --audit-level=high` does fail one. One
# catches what has not been fixed yet, the other brings the fix in.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # PRs go to development, never to main: `main` only receives from
    # development, and the guard-main-source job would fail any other source.
    target-branch: development
    commit-message:
      # Matches commitlint (config-conventional): without this, every Dependabot
      # PR fails the commitlint job.
      prefix: build
      prefix-development: chore
      include: scope
    ignore:
      # TypeScript does not go up a major on its own. It has to move in lockstep
      # with the ts-jest peer, with typescript-eslint and with Nest — the first
      # automated PR that tried (TS 7) failed at `npm ci` already, because the
      # ts-jest@29 peer does not accept it. Minor and patch keep flowing.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The Node types track the runtime this project actually runs
      # (node:24-alpine in the Dockerfile, node-version: 24 in CI). Typing
      # against a newer major approves, at compile time, APIs that do not exist
      # in production.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per ecosystem instead of one per package. The Nest dependencies go
      # up together, and reviewing them across seven separate PRs is noise.
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      # `@eslint/*` has to be here explicitly: the `eslint*` pattern does not
      # match a name starting with `@`, and without this line `@eslint/js` comes
      # out in a PR of its own proposing exactly the major desync with `eslint` —
      # which is what happened on day one.
      types-and-linting:
        patterns:
          [
            '@types/*',
            'eslint',
            'eslint-*',
            '@eslint/*',
            'typescript-eslint',
            'prettier*',
            'typescript',
          ]
      jest:
        patterns:
          ['jest', 'ts-jest', '@types/jest', 'supertest', '@types/supertest']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    target-branch: development
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
