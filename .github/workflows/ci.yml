# Main pipeline. Runs on PRs and on pushes to both long-lived branches.
#
# `development` is this repository's main branch: all work comes out of it, and
# it is the one — and the only one — that opens a PR into `main`. The trigger
# covers both because a direct push to `development` is allowed (see the Phase 5
# ruleset), and a push nobody checks protects nothing.
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# A new push on the same branch makes the previous run irrelevant. Without this,
# a quick sequence of commits queues up builds nobody is going to read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrictive default; the jobs that need more (docker → packages: write) raise
# it locally.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # GitHub rulesets know how to require a PR, but not how to restrict the branch
  # it comes *from*. This job is the only real enforcement of "main only receives
  # from development" — without it, any branch can open a PR into main and the
  # ruleset approves.
  #
  # It always runs, rather than carrying a job-level `if:`, so that it publishes
  # a real conclusion on every run: a skipped job shows up as neutral in the
  # required status check, and the difference between "passed" and "did not even
  # run" is exactly what you do not want ambiguous in a guard.
  # ---------------------------------------------------------------------------
  guard-main-source:
    name: guard-main-source
    runs-on: ubuntu-latest
    steps:
      - name: main only accepts pull requests from development
        # Via env, not interpolated straight into the script: `head_ref` is
        # chosen by whoever opens the PR, and a branch name containing `$(...)`
        # would execute on the runner.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "main" ]; then
            echo "Not a PR into main — nothing to enforce here."
            exit 0
          fi
          if [ "$HEAD_REF" != "development" ]; then
            echo "::error::main only accepts PRs coming from development; this one came from '$HEAD_REF'."
            exit 1
          fi
          echo "OK: PR from development into main."

  # ---------------------------------------------------------------------------
  # The local commit-msg hook falls to a `git commit --no-verify`. This one does
  # not.
  # ---------------------------------------------------------------------------
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint compares a range of commits; a shallow checkout does not
          # have the common ancestor needed to compute that range.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No `prisma generate`: commitlint reads commit messages, it does not
      # compile TypeScript. Generating the client here would be ~20s per run for
      # no use at all.
      - run: npm ci

      - name: Validate the PR's commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          npx commitlint --from "origin/$BASE_REF" --to HEAD --verbose

  # ---------------------------------------------------------------------------
  # Lint, formatting and types. It is one of the required status checks on both
  # branches (Phase 5), so the job name is a contract — renaming it breaks the
  # protection silently.
  # ---------------------------------------------------------------------------
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `src/generated/prisma` is gitignored. Without this step tsc cannot
      # resolve the client's imports and the job fails for a reason that has
      # nothing to do with the PR's code.
      - name: Generate the Prisma Client
        run: npm run prisma:generate

      # No `--fix`: the `npm run lint` script rewrites files, which in CI only
      # hides the problem instead of failing on it.
      - name: ESLint (read-only)
        run: npx eslint "{src,test}/**/*.ts"

      - name: Prettier
        run: npm run format:check

      # Both of them, and for different reasons.
      #
      # `tsconfig.build.json` is the configuration the production image is
      # compiled with, and `rootDir: ./src` leaves `test/` entirely out of it.
      #
      # The root tsconfig covers `test/`, which otherwise nobody would check:
      # the repository's `isolatedModules` puts ts-jest in transpile-only mode,
      # so a `const n: number = 'text'` in a spec passes the entire suite without
      # a complaint. Measured, not assumed.
      - name: TypeScript (build)
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: TypeScript (repository, includes test/)
        run: npx tsc --noEmit -p tsconfig.json

  # ---------------------------------------------------------------------------
  # The three tiers against the same ephemeral environment that runs locally.
  #
  # `docker compose` instead of Actions' `services:`: `services:` cannot override
  # a container's `command`, and Redis here *has to* start with
  # `--maxmemory-policy noeviction` (CLAUDE.md). A single compose file serving
  # both environments is what keeps them from drifting apart.
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate the Prisma Client
        run: npm run prisma:generate

      # The same script the documentation tells you to run locally: brings the
      # test compose up with `--wait` and applies the migrations with .env.test.
      - name: Start the ephemeral database and apply the migrations
        run: npm run test:setup

      # All three with `--coverage`. Only the unit tier used to produce a report,
      # and that understated coverage by the design of the suite rather than by
      # any absence of tests: controllers, guards, JwtStrategy and
      # RefreshTokenService are exercised by the integration and e2e tiers by
      # choice, so they counted as uncovered. Measured on PR #26: 54% from the
      # unit tier alone, 97.7% across the three.
      - name: Unit tests
        run: npm run test:unit -- --coverage

      - name: Integration tests
        run: npm run test:int -- --coverage

      - name: e2e tests
        run: npm run test:e2e -- --coverage

      - name: Upload the coverage
        # `always()` so that the coverage of a failed run stays available — that
        # is precisely when it is useful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            coverage-integration/
            coverage-e2e/
          retention-days: 7
          # `warn`, not `error`: with `always()` this step also runs when the job
          # failed before any test ran, and then the absence of coverage is a
          # consequence, not a second failure to investigate.
          if-no-files-found: warn

      - name: Tear down the ephemeral database
        if: always()
        run: npm run infra:test:down

  # ---------------------------------------------------------------------------
  # Complements Dependabot: it opens PRs, but fails no build. Here a high-severity
  # vulnerability stops the merge.
  # ---------------------------------------------------------------------------
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm audit` resolves the tree from package-lock.json; it needs neither
      # node_modules nor the Prisma Client.
      - name: npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Written and switched off. It switches itself on when the repository variable
  # SONAR_ENABLED is set to 'true' (see "Manual steps" in the checklist).
  #
  # `vars` and not `secrets` in the condition: the `secrets` context is not
  # evaluable in a job-level `if:`, so conditioning on the token's existence
  # would not work.
  # ---------------------------------------------------------------------------
  sonar:
    name: sonar
    # The second term is not a preference: Dependabot PRs do not receive the
    # normal Actions secrets — they run against a separate store (Dependabot
    # secrets) — so `secrets.SONAR_TOKEN` arrives empty and the scanner dies with
    # "Not authorized or project not found". The `vars` do arrive, which makes
    # the failure confusing: the job runs because SONAR_ENABLED is there, and
    # fails because the token is not. Duplicating the token into the other store
    # would fix it, but analysing a lockfile bump in Sonar adds nothing that
    # justifies spreading the credential around.
    if: vars.SONAR_ENABLED == 'true' && github.actor != 'dependabot[bot]'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar uses the history to attribute issues to authors and to compute
          # a PR's "new code".
          fetch-depth: 0

      # At the root: the artifact carries the three coverage directories, one per
      # tier.
      - name: Download the coverage from the test job
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: .

      # `sonar.tests` includes `src` because the unit specs live next to the
      # code, and `sonar.sources=src` alone analysed them as production code. Two
      # consequences, both measured on PR #26: the specs entered the coverage
      # denominator without ever being covered (61.2% reported against 91.7%
      # real), and the fixture passwords were raised as MAJOR "hard-coded
      # password" findings, dropping `new_security_rating` to 3. The specs under
      # `test/` never suffered from either, precisely because they were already
      # in `sonar.tests`.
      #
      # The three properties work together: `exclusions` takes the specs out of
      # `sources` so no file is indexed twice, and `test.inclusions` delimits
      # what, inside `test,src`, counts as a test.
      #
      # v6 and not v5: v5 carries a high-severity argument injection
      # vulnerability (GHSA, fixed in 6.0.0), and the action itself prints that
      # warning on every run. Here `args` only receives repository variables,
      # which only an admin sets — but there is no reason to keep the vulnerable
      # version when v6 accepts exactly the same inputs.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.tests=test,src
            -Dsonar.test.inclusions=test/**/*.ts,src/**/*.spec.ts
            -Dsonar.exclusions=src/generated/**,src/**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info,coverage-e2e/lcov.info

  # ---------------------------------------------------------------------------
  # Builds on every PR (the Dockerfile is code and breaks like code); pushes only
  # on a push to main.
  # ---------------------------------------------------------------------------
  docker:
    name: docker
    needs: [quality, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Only to have the Prisma CLI and apply the migrations to the database the
      # image's smoke test runs against. The image does not carry the CLI.
      - run: npm ci

      - name: Start the ephemeral database and apply the migrations
        run: npm run test:setup

      - uses: docker/setup-buildx-action@v4

      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # A lowercase literal on purpose: GHCR rejects uppercase and
          # `github.repository` is "brunocbarbosa/NexusOps_backend".
          images: ghcr.io/brunocbarbosa/nexusops_backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # `load: true` and no `push:`. The image has to exist in the local daemon
      # for the two tests below, and publishing before testing would be
      # publishing blind. The push happens afterwards, over these same tags that
      # were already built.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Guard against the .tsbuildinfo defect (Phase 3): an incremental cache
      # outside of what `deleteOutDir` cleans makes a clean build emit zero files
      # and exit 0. The `COPY` of an empty dist/ does not fail either, so the
      # image only gives itself away when you try to boot it.
      - name: The image boots and answers HTTP
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Any of the tags points at the same image; the first line is enough
          # and does not depend on metadata-action's priority ordering.
          IMAGE_REF="$(echo "$TAGS" | head -n1)"
          # The application validates its environment at boot and exits on a
          # missing variable, so booting it with none would test the validation
          # and not the build. Same source of truth as the next step: the
          # .env.test the suite already uses.
          #
          # NODE_ENV is deliberately not passed through — the image keeps its own
          # `production`, which makes this step also exercise the placeholder
          # JWT_SECRET refusal. The database does not need to exist: Prisma
          # connects on the first query, and none happens here.
          set -a
          . ./.env.test
          set +a
          docker run -d --rm --name nexusops-boot -p 3000:3000 \
            -e PORT=3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_EXPIRES_IN="$JWT_EXPIRES_IN" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e JWT_REFRESH_EXPIRES_IN="$JWT_REFRESH_EXPIRES_IN" \
            -e BCRYPT_SALT_ROUNDS="$BCRYPT_SALT_ROUNDS" \
            "$IMAGE_REF"
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000 > /dev/null; then
              echo "OK: the image answered after $i attempt(s)."
              docker stop nexusops-boot
              exit 0
            fi
            sleep 1
          done
          echo "::error::The image did not answer on port 3000 within 30s."
          docker logs nexusops-boot
          docker stop nexusops-boot
          exit 1

      # The Dockerfile removes the Prisma CLI, Studio, the legacy engines and
      # every query compiler that is not PostgreSQL's. All of it loads lazily: a
      # wrong prune does not show up at boot, only on the first real query. This
      # step is what keeps the prune from becoming an unverified claim.
      - name: Prisma smoke test inside the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE_REF="$(echo "$TAGS" | head -n1)"
          # One source of truth for the URL: the same .env.test the suite uses.
          # `set -a` exports and the shell strips the quotes — docker's
          # `--env-file` would pass them literally into the variable.
          set -a
          . ./.env.test
          set +a
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE_REF" \
            node scripts/docker-smoke.js

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A plain `docker push` instead of a second build-push-action: the image is
      # already built and tested, and rebuilding it to publish would mean
      # publishing an artifact that is not bit-for-bit what passed the tests
      # above.
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "$TAGS" | xargs -rn1 docker push

      - name: Tear down the ephemeral database
        if: always()
        run: npm run infra:test:down
