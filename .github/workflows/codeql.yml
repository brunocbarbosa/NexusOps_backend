# GitHub's native static security analysis. Free on this repository because
# Phase 0 made it public.
#
# Kept separate from ci.yml on purpose: CodeQL has its own weekly schedule and
# its own permission (`security-events: write`), and folding it into the pipeline
# would force the whole of ci.yml to carry that permission.
name: CodeQL

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  schedule:
    # Monday, 04:12 UTC. The schedule is what catches a new vulnerability in old
    # code: a query published after the merge would never run against a file
    # nobody touches any more.
    - cron: '12 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          # A single language: the repository is TypeScript end to end.
          # `javascript-typescript` covers both — there is no separate
          # `typescript`.
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: CodeQL analyses JavaScript/TypeScript straight from
      # source. Compiling would be wasted work, and `src/generated/`
      # (gitignored) never reaches the checkout at all.
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
